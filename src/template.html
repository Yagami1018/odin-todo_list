<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo</title>
</head>

<body>
    <header>
        <h1>ToDo List</h1>
    </header>
    <main>
        <aside>
            <h3>Menu</h3>
            <form class="task-form" action="" method="post">
                <input class="form-input" type="text" placeholder="Task..." autocomplete="off" required autofocus name="task">
                <button class="form-btn" type="submit">Add</button>
            </form>
        </aside>
        <section>
            <h3>Tasks</h3>
            <ol class="tasks-list">
                <li class="task-item">
                    <p class="task-name">
                        Walk the Dog
                    </p>
                    <div class="task-btns">
                        <button class="toggle-btn">Toggle</button>
                        <button class="rm-btn">Remove</button>
                    </div>
                </li>
            </ol>
        </section>
    </main>
    <footer>
        <a href="https://github.com/Yagami1018" target="_blank"> &copy;Yagami1018</a>
    </footer>
</body>

</html>
